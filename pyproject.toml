[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "experimentacionmlflowModule"
version = "0.0.1"
description = "Script de entrenamiento parametrizado para predecir mpg (Auto MPG, UCI) con registro de experimentos monitoreados en MLFlow"
authors = [
  { name = "FernandoGutierrez" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["experimentacionmlflowModule"]
include = ["pyproject.toml", "experimentacionmlflowModule/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["experimentacionmlflowModule"]
force-sort-within-sections = true

